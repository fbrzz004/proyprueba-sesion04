<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Proyecto de prueba</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="contenedor">
        <section class="tarjeta-login" aria-labelledby="titulo-login">
            <h1 id="titulo-login">Iniciar sesión</h1>

            <form id="login-form" novalidate>
                <div class="campo">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" autocomplete="username" required>
                </div>

                <div class="campo">
                    <label for="clave">Contraseña</label>
                    <div class="grupo-clave">
                        <input type="password" id="clave" name="clave" autocomplete="current-password" required>
                        <button type="button" id="mostrar-clave" aria-label="Mostrar contraseña">Mostrar</button>
                    </div>
                </div>

                <button type="submit" class="boton-ingresar">Ingresar</button>
                <p id="mensaje" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
